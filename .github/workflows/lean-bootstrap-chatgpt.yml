name: Lean 4.33 Drive bootstrap relay

on:
  push:
    branches:
      - chatgpt/lean-bootstrap-20260912
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download user's Lean 4.33.1 Drive copy
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --user --quiet gdown
          ~/.local/bin/gdown '1Jq40qSQL_YuiRMZpo2XOQG3yrcsWdar-' -O /tmp/lean-4.33.1-linux.tar.zst
          ls -lh /tmp/lean-4.33.1-linux.tar.zst
          test "$(stat -c%s /tmp/lean-4.33.1-linux.tar.zst)" = '570405234'
          echo '890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  /tmp/lean-4.33.1-linux.tar.zst' | sha256sum -c -

      - name: Extract and compile Kmu smoke proofs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/lean4
          tar --zstd -xf /tmp/lean-4.33.1-linux.tar.zst -C /tmp/lean4 --strip-components=1
          /tmp/lean4/bin/lean --version | tee /tmp/lean-version.txt
          /tmp/lean4/bin/lake --version | tee /tmp/lake-version.txt
          /tmp/lean4/bin/lean lean/KmuSmoke.lean 2>&1 | tee /tmp/kmu-proof.log
          du -sh /tmp/lean4 /tmp/lean4/bin /tmp/lean4/lib /tmp/lean4/lib/lean || true
          ldd /tmp/lean4/bin/lean || true

      - name: Build and validate minimal local 4.33.1 toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/lean-min/bin /tmp/lean-min/lib
          cp /tmp/lean4/bin/lean /tmp/lean-min/bin/
          cp /tmp/lean4/bin/lake /tmp/lean-min/bin/
          cp -a /tmp/lean4/lib/lean /tmp/lean-min/lib/
          /tmp/lean-min/bin/lean --version
          /tmp/lean-min/bin/lake --version
          /tmp/lean-min/bin/lean lean/KmuSmoke.lean
          du -sh /tmp/lean-min
          tar -I 'zstd -12 -T0' -cf /tmp/lean-4.33.1-minimal.tar.zst -C /tmp lean-min
          ls -lh /tmp/lean-4.33.1-minimal.tar.zst
          sha256sum /tmp/lean-4.33.1-minimal.tar.zst | tee /tmp/lean-minimal.sha256

      - name: Upload proof report
        uses: actions/upload-artifact@v4
        with:
          name: kmu-lean-4.33.1-proof-report
          path: |
            /tmp/lean-version.txt
            /tmp/lake-version.txt
            /tmp/kmu-proof.log
            /tmp/lean-minimal.sha256
            lean/KmuSmoke.lean
          if-no-files-found: error
          compression-level: 9

      - name: Relay minimal Lean 4.33.1 toolchain
        uses: actions/upload-artifact@v4
        with:
          name: lean-4.33.1-minimal
          path: /tmp/lean-4.33.1-minimal.tar.zst
          if-no-files-found: error
          compression-level: 0
